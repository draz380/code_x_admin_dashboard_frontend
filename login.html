<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | لوحة تحكم Code X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #e0f2fe 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-slate-800 antialiased flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl border border-sky-100 p-8 shadow-xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 via-sky-500 to-cyan-400 text-white flex items-center justify-center text-2xl shadow-lg shadow-sky-200">
                <i class="fa-solid fa-code"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900">تسجيل الدخول للإدارة</h1>
            <p class="text-xs text-slate-500">منصة Code X - لوحة التحكم والمصادقة الأمنية</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">البريد الإلكتروني</label>
                <input type="email" id="login-email" required placeholder="admin@codex.platform" class="w-full px-4 py-3 rounded-2xl bg-sky-50/50 border border-sky-100 text-sm font-medium focus:outline-none focus:border-sky-400">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl bg-sky-50/50 border border-sky-100 text-sm font-medium focus:outline-none focus:border-sky-400">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-2xl bg-gradient-to-l from-blue-600 via-sky-500 to-cyan-500 hover:opacity-95 text-white text-sm font-black shadow-lg shadow-sky-200 transition">
                دخول إلى لوحة التحكم
            </button>
        </form>

        <div class="text-center pt-2 border-t border-sky-100 text-xs text-slate-500">
            ليس لديك حساب مدير؟ <a href="signup.html" class="font-bold text-blue-600 hover:underline">إنشاء حساب إداري جديد</a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const users = Store.getUsers();
            const user = users.find(u => u.email === email);

            if (!user) {
                showToast('البريد الإلكتروني غير مسجل!', 'error');
                return;
            }
            if (user.password !== hashPassword(password)) {
                showToast('كلمة المرور غير صحيحة!', 'error');
                return;
            }

            localStorage.setItem(DB_KEYS.CURRENT_USER, user.id);
            localStorage.setItem(DB_KEYS.ROLE, 'admin');
            showToast('تم تسجيل الدخول بنجاح أهلاً بك يا ' + user.name);
            setTimeout(() => { window.location.href = 'posts.html'; }, 600);
        }
    </script>
</body>
</html>
