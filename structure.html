<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة هيكلة الموقع | لوحة تحكم Code X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #e0f2fe 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="admin-header"></div>

    <main class="max-w-[1500px] mx-auto px-4 sm:px-6 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <aside id="admin-sidebar" class="hidden lg:block lg:col-span-3"></aside>
            <section class="lg:col-span-9 space-y-6">
                
<div class="space-y-6">
    <!-- التحكم العام في الهوية والشعار والألوان الجديدة -->
    <div class="bg-white rounded-3xl border border-sky-100 p-6 sm:p-8 shadow-sm space-y-6">
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-3 pb-4 border-b border-sky-100">
            <i class="fa-solid fa-palette text-blue-600"></i>
            <span>التحكم في الشعار والألوان الجديدة وإعدادات الهيدر</span>
        </h1>
        <form onsave="saveBranding(event)" onsubmit="saveBranding(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">اسم الشعار (Brand Name)</label>
                    <input type="text" id="cfg-brand" required class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">العنوان الفرعي للشعار</label>
                    <input type="text" id="cfg-subtitle" required class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">اختر تدرج الألوان الجديد (Tailwind Palettes)</label>
                <select id="cfg-color" class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-bold text-slate-800">
                    <option value="from-blue-600 via-sky-500 to-cyan-400">أزرق سماوي مبهج (الافتراضي)</option>
                    <option value="from-indigo-600 via-purple-600 to-pink-500">نيلي مع وردي ملوكي ساحر</option>
                    <option value="from-cyan-600 via-teal-500 to-emerald-400">تركواز وأخضر زمردي منعش</option>
                    <option value="from-amber-500 via-orange-500 to-rose-500">برتقالي وذهبي دافئ</option>
                    <option value="from-slate-800 via-slate-700 to-slate-900">وضع مظلم فخم (Dark Tech)</option>
                </select>
            </div>
            <button type="submit" class="px-6 py-2.5 rounded-2xl bg-gradient-to-l from-blue-600 to-sky-500 text-white font-black text-xs shadow-md">
                حفظ الألوان الجديدة والهوية
            </button>
        </form>
    </div>

    <!-- التحكم في إظهار وإخفاء الأقسام -->
    <div class="bg-white rounded-3xl border border-sky-100 p-6 sm:p-8 shadow-sm space-y-6">
        <h2 class="text-xl font-black text-slate-900 flex items-center gap-3 pb-4 border-b border-sky-100">
            <i class="fa-solid fa-eye text-sky-500"></i>
            <span>التحكم في الأقسام (إخفاء وإظهار)</span>
        </h2>
        <div id="sections-toggle-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <!-- إضافة صفحة جديدة وعنصر نافبار -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-3xl border border-sky-100 p-6 sm:p-8 shadow-sm space-y-5">
            <h2 class="text-lg font-black text-slate-900 flex items-center gap-2.5 pb-3 border-b border-sky-100">
                <i class="fa-solid fa-file-circle-plus text-blue-600"></i>
                <span>إضافة صفحة جديدة</span>
            </h2>
            <form onsubmit="addNewPage(event)" class="space-y-3">
                <input type="text" id="page-title" required placeholder="عنوان الصفحة (مثال: سياسة الاستخدام)" class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium">
                <input type="text" id="page-slug" required placeholder="اسم الملف (مثال: privacy.html)" class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium">
                <textarea id="page-content" rows="3" required placeholder="محتوى الصفحة..." class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium"></textarea>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs shadow-md">إنشاء الصفحة</button>
            </form>
        </div>

        <div class="bg-white rounded-3xl border border-sky-100 p-6 sm:p-8 shadow-sm space-y-5">
            <h2 class="text-lg font-black text-slate-900 flex items-center gap-2.5 pb-3 border-b border-sky-100">
                <i class="fa-solid fa-bars-staggered text-sky-500"></i>
                <span>إضافة عنصر على النافبار</span>
            </h2>
            <form onsubmit="addNavItem(event)" class="space-y-3">
                <input type="text" id="nav-title" required placeholder="اسم الرابط في القائمة (مثال: المدونة)" class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium">
                <input type="text" id="nav-url" required placeholder="رابط الصفحة (مثال: blog.html)" class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium">
                <button type="submit" class="w-full py-2.5 rounded-xl bg-cyan-600 text-white font-bold text-xs shadow-md">إضافة إلى النافبار</button>
            </form>
        </div>
    </div>
</div>

            </section>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        renderAdminShell('structure');
        
function loadStructureForm() {
    const config = Store.getConfig();
    document.getElementById('cfg-brand').value = config.brandName;
    document.getElementById('cfg-subtitle').value = config.brandSubtitle;
    document.getElementById('cfg-color').value = config.primaryColor;

    const toggles = [
        { key: 'comments', label: 'إدارة التعليقات' },
        { key: 'posts', label: 'إدارة المنشورات' },
        { key: 'users', label: 'إدارة المستخدمين' },
        { key: 'friends', label: 'الصداقات والتواصل' },
        { key: 'employees', label: 'إدارة الموظفين' }
    ];

    document.getElementById('sections-toggle-grid').innerHTML = toggles.map(t => `
        <div class="p-4 rounded-2xl bg-sky-50/50 border border-sky-100 flex items-center justify-between">
            <span class="text-xs font-bold text-slate-800">${t.label}</span>
            <input type="checkbox" ${config.showSections[t.key] !== false ? 'checked' : ''} onchange="toggleSection('${t.key}', this.checked)" class="w-5 h-5 text-blue-600 rounded cursor-pointer">
        </div>
    `).join('');
}

function saveBranding(e) {
    e.preventDefault();
    let config = Store.getConfig();
    config.brandName = document.getElementById('cfg-brand').value.trim();
    config.brandSubtitle = document.getElementById('cfg-subtitle').value.trim();
    config.primaryColor = document.getElementById('cfg-color').value;
    Store.saveConfig(config);
    showToast('تم حفظ الألوان والهوية الجديدة بنجاح');
    setTimeout(() => window.location.reload(), 500);
}

function toggleSection(key, val) {
    let config = Store.getConfig();
    config.showSections[key] = val;
    Store.saveConfig(config);
    showToast('تم تحديث حالة القسم بنجاح');
}

function addNewPage(e) {
    e.preventDefault();
    const title = document.getElementById('page-title').value.trim();
    const slug = document.getElementById('page-slug').value.trim();
    let config = Store.getConfig();
    config.customPages.push({ id: 'p_' + Date.now(), title, slug });
    Store.saveConfig(config);
    e.target.reset();
    showToast('تمت إضافة الصفحة الجديدة بنجاح');
}

function addNavItem(e) {
    e.preventDefault();
    const title = document.getElementById('nav-title').value.trim();
    const url = document.getElementById('nav-url').value.trim();
    let config = Store.getConfig();
    config.customNavItems.push({ title, url });
    Store.saveConfig(config);
    e.target.reset();
    showToast('تمت إضافة العنصر إلى النافبار بنجاح');
}

loadStructureForm();

    </script>
</body>
</html>
