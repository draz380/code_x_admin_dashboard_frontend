<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنشورات | لوحة تحكم Code X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #e0f2fe 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="admin-header"></div>

    <main class="max-w-[1500px] mx-auto px-4 sm:px-6 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <aside id="admin-sidebar" class="hidden lg:block lg:col-span-3"></aside>
            <section class="lg:col-span-9 space-y-6">
                
<div class="bg-white rounded-3xl border border-sky-100 p-6 sm:p-8 shadow-sm space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-sky-100">
        <div>
            <h1 class="text-xl sm:text-2xl font-black text-slate-900 flex items-center gap-3">
                <i class="fa-solid fa-newspaper text-sky-500"></i>
                <span>إدارة المنشورات التقنية</span>
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">مراجعة المنشورات، تعديل محتواها، أو حذف المخالف منها</p>
        </div>
        <button onclick="openNewPostModal()" class="px-5 py-2.5 rounded-2xl bg-gradient-to-l from-blue-600 to-sky-500 text-white font-black text-xs shadow-md shadow-sky-200">
            <i class="fa-solid fa-plus ml-1.5"></i> إضافة منشور جديد
        </button>
    </div>

    <div id="posts-list" class="space-y-4"></div>
</div>

<!-- Modal for Post Edit / Create -->
<div id="post-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border border-sky-100 max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-5">
        <h3 id="modal-title" class="text-lg font-black text-slate-900">إضافة منشور جديد</h3>
        <form onsubmit="savePost(event)" class="space-y-4">
            <input type="hidden" id="post-id">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">التصنيف</label>
                <input type="text" id="post-category" required class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">عنوان المنشور</label>
                <input type="text" id="post-title" required class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">المحتوى التقني</label>
                <textarea id="post-content" rows="4" required class="w-full px-4 py-2.5 rounded-xl bg-sky-50/60 border border-sky-100 text-xs font-medium"></textarea>
            </div>
            <div class="flex items-center justify-end gap-3 pt-2">
                <button type="button" onclick="closePostModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">إلغاء</button>
                <button type="submit" class="px-6 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold shadow-md">حفظ المنشور</button>
            </div>
        </form>
    </div>
</div>

            </section>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        renderAdminShell('posts');
        
function renderPostsAdmin() {
    const posts = Store.getPosts();
    const users = Store.getUsers();
    const container = document.getElementById('posts-list');

    if (posts.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-400 font-bold text-sm">لا توجد منشورات حالياً.</div>';
        return;
    }

    container.innerHTML = posts.map(p => {
        const author = users.find(u => u.id === p.authorId) || { name: 'مدير المنصة', avatar: 'م' };
        return `
        <div class="p-5 rounded-2xl bg-white border border-sky-100 shadow-sm space-y-3 hover:border-sky-300 transition">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 text-white font-bold flex items-center justify-center shrink-0 shadow-sm">
                        ${author.avatar}
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-900">${author.name}</p>
                        <p class="text-[10px] text-sky-600">${p.category} • ${p.createdAt}</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openEditPostModal('${p.id}')" class="px-3 py-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 text-blue-700 text-xs font-bold transition">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button onclick="deletePost('${p.id}')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold transition">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>
            <h2 class="text-sm sm:text-base font-black text-slate-900">${p.title}</h2>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${p.content}</p>
            <div class="flex items-center gap-4 text-xs font-bold text-slate-500 pt-2 border-t border-sky-50">
                <span><i class="fa-solid fa-heart text-pink-500 ml-1"></i>${(p.likes || []).length} إعجاب</span>
                <span><i class="fa-solid fa-share-nodes text-cyan-500 ml-1"></i>${p.shares || 0} مشاركة</span>
            </div>
        </div>`;
    }).join('');
}

function openNewPostModal() {
    document.getElementById('modal-title').innerText = 'إضافة منشور جديد';
    document.getElementById('post-id').value = '';
    document.getElementById('post-category').value = 'تكنولوجيا المعلومات والبرمجة';
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';
    document.getElementById('post-modal').classList.remove('hidden');
}

function openEditPostModal(id) {
    const posts = Store.getPosts();
    const p = posts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modal-title').innerText = 'تعديل المنشور';
    document.getElementById('post-id').value = p.id;
    document.getElementById('post-category').value = p.category;
    document.getElementById('post-title').value = p.title;
    document.getElementById('post-content').value = p.content;
    document.getElementById('post-modal').classList.remove('hidden');
}

function closePostModal() {
    document.getElementById('post-modal').classList.add('hidden');
}

function savePost(e) {
    e.preventDefault();
    const id = document.getElementById('post-id').value;
    const category = document.getElementById('post-category').value.trim();
    const title = document.getElementById('post-title').value.trim();
    const content = document.getElementById('post-content').value.trim();
    const user = Store.getCurrentUser();
    let posts = Store.getPosts();

    if (id) {
        posts = posts.map(p => p.id === id ? { ...p, category, title, content } : p);
        showToast('تم تحديث المنشور بنجاح');
    } else {
        posts.unshift({
            id: 'p_' + Date.now(),
            authorId: user.id,
            category,
            title,
            content,
            createdAt: 'الآن',
            likes: [],
            shares: 0
        });
        showToast('تمت إضافة المنشور بنجاح');
    }

    Store.savePosts(posts);
    closePostModal();
    renderPostsAdmin();
}

function deletePost(id) {
    let posts = Store.getPosts().filter(p => p.id !== id);
    Store.savePosts(posts);
    showToast('تم حذف المنشور بنجاح');
    renderPostsAdmin();
}

renderPostsAdmin();

    </script>
</body>
</html>
